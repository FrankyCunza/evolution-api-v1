version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - evolution-postgres
      - minio # <-- AÑADIDO
      - audio-converter # <-- AÑADIDO
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
      - dokploy-network
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - evolution-net
    environment:
      - VITE_API_URL=http://evolution_api:8080
    entrypoint: /bin/sh
    command: '-c "sed -i "s/ must-revalidate//g" /etc/nginx/conf.d/nginx.conf && nginx -g "daemon off;" "'

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      evolution-net:
        aliases:
          - evolution-redis
      dokploy-network:
        aliases:
          - evolution-redis
    expose:
      - "6379"

  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net
      - dokploy-network
    expose:
      - "5432"

  # ------------------------------------------------------------------
  # NUEVO SERVICIO: MinIO (Almacenamiento S3)
  # ------------------------------------------------------------------
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2023-10-30T04-12-07Z
    restart: always
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Consola Web (opcional)
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY} 
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    volumes:
      - minio_data:/data 
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - evolution-net
    expose:
      - "9000"

  # ------------------------------------------------------------------
  # NUEVO SERVICIO: Conversor de Audio a MP3
  # ------------------------------------------------------------------
  audio-converter:
    container_name: evolution_audio_converter
    image: atendai/evolution-audio-converter:latest 
    restart: always
    ports:
      - "4040:4040"
    env_file:
      - .env # Usa el nuevo archivo .env para sus configuraciones
    depends_on:
      minio:
        condition: service_healthy # Espera a que MinIO esté listo
    networks:
      - evolution-net
    expose:
      - "4040"

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:
  minio_data: # <--- NUEVO VOLUMEN DEFINIDO PARA MINIO

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
  dokploy-network:
    external: true